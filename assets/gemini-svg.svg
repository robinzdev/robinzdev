<svg xmlns="http://www.w3.org/2000/svg" width="220" height="56" viewBox="0 0 220 56">
  <style>
    .brutal-card {
      transition: transform 0.15s ease, fill 0.15s ease;
      cursor: pointer;
    }
    .brutal-card:hover {
      transform: translate(-3px, -3px);
    }
    .brutal-card:hover rect.front {
      fill: #CCFF00;
    }
  </style>

  <!-- Sombra dura fija -->
  <rect x="6" y="6" width="206" height="42" fill="#000000" rx="3" />

  <!-- Capa interactiva con efecto hover -->
  <g class="brutal-card">
    <rect class="front" x="0" y="0" width="206" height="42" fill="#FAF8F5" stroke="#000000" stroke-width="3" rx="3" />
    <text x="103" y="26" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">
      PORTFOLIO WEB ↗
    </text>
  </g>
</svg>
